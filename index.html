<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipper</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 560px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 28px;
        color: #64748b;
        font-size: 1.05rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .link-form {
        display: flex;
        overflow: hidden;
        min-height: 58px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }

      .link-form:focus-within {
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgb(99 102 241 / 16%);
      }

      input {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 0 18px;
        outline: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }

      input::placeholder {
        color: #94a3b8;
      }

      button {
        display: grid;
        width: 58px;
        flex: 0 0 58px;
        place-items: center;
        border: 0;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }

      button:focus-visible {
        outline: 3px solid #a5b4fc;
        outline-offset: -5px;
      }

      .video-message {
        margin-top: 16px;
        color: #64748b;
        font-size: 0.95rem;
      }

      .video-message[hidden],
      .video-frame[hidden] {
        display: none;
      }

      .video-message[data-loading="true"]::before {
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-right: 8px;
        border: 2px solid #cbd5e1;
        border-top-color: #4f46e5;
        border-radius: 50%;
        content: "";
        vertical-align: -0.1em;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .video-frame {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin-top: 24px;
        border: 0;
        border-radius: 12px;
        background: #0f172a;
      }

      .transcript-section {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #fff;
        text-align: left;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }

      .transcript-section[hidden] {
        display: none;
      }

      .transcript-section h2 {
        margin: 0 0 16px;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }

      .transcript-section label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .transcript-section textarea,
      .transcript-section select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .transcript-section textarea {
        min-height: 180px;
        padding: 12px 14px;
        resize: vertical;
      }

      .transcript-section textarea::placeholder {
        color: #94a3b8;
      }

      .transcript-section textarea:focus-visible,
      .transcript-section select:focus-visible {
        outline: 3px solid rgb(99 102 241 / 20%);
        border-color: #6366f1;
      }

      .clip-duration {
        margin-top: 16px;
      }

      .transcript-section select {
        min-height: 46px;
        padding: 0 12px;
      }

      .analyze-button {
        display: inline-flex;
        width: auto;
        min-height: 46px;
        padding: 0 18px;
        align-items: center;
        gap: 10px;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
      }

      .transcript-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .submitted-transcript {
        max-height: 360px;
        overflow: auto;
        margin: 16px 0 0;
        padding: 14px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        color: #334155;
        font: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .submitted-transcript[hidden] {
        display: none;
      }

      .analyze-button:disabled {
        cursor: wait;
        opacity: 0.75;
      }

      .button-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgb(255 255 255 / 45%);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .button-spinner[hidden] {
        display: none;
      }

      .transcript-message {
        margin: 12px 0 0;
        color: #475569;
        font-size: 0.92rem;
      }

      .transcript-message[data-error="true"] {
        color: #b91c1c;
      }

      .transcript-message[data-loading="true"]::before {
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-right: 8px;
        border: 2px solid #cbd5e1;
        border-top-color: #4f46e5;
        border-radius: 50%;
        content: "";
        vertical-align: -0.1em;
        animation: spin 0.8s linear infinite;
      }

      .transcript-message[hidden] {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .video-message[data-loading="true"]::before {
          animation-duration: 1.6s;
        }

        .button-spinner {
          animation-duration: 1.6s;
        }

        .transcript-message[data-loading="true"]::before {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find the best parts of your video</h1>
      <p>Paste a video link from any platform to get started.</p>
      <form class="link-form" method="get">
        <label for="video-link" class="visually-hidden">Video link</label>
        <input
          id="video-link"
          name="video-link"
          type="text"
          inputmode="url"
          autocomplete="url"
          placeholder="Paste a video link here..."
        />
        <button type="submit" aria-label="Submit video link">
          <svg
            aria-hidden="true"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>
      <div id="video-message" class="video-message" role="status" aria-live="polite" hidden></div>
      <iframe
        id="video-frame"
        class="video-frame"
        title="YouTube video preview"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        hidden
      ></iframe>
      <section
        id="transcript-section"
        class="transcript-section"
        aria-labelledby="transcript-heading"
        hidden
      >
        <h2 id="transcript-heading">Video Transcript</h2>
        <form id="transcript-form">
          <label for="transcript-input">Paste your transcript</label>
          <textarea
            id="transcript-input"
            name="transcript"
            placeholder="Paste the video transcript here. Include timestamps when available (for example, 00:12)."
          ></textarea>
          <div class="clip-duration">
            <label for="clip-duration">Clip duration</label>
            <select id="clip-duration" name="clip-duration">
              <option value="15">15 seconds</option>
              <option value="30">30 seconds</option>
              <option value="60">60 seconds</option>
              <option value="60">1 minute</option>
              <option value="120">2 minutes</option>
              <option value="180">3 minutes</option>
            </select>
          </div>
          <div class="transcript-actions">
            <button
              id="submit-transcript-button"
              class="analyze-button"
              type="submit"
            >
              Submit Transcript
            </button>
            <button
              id="analyze-button"
              class="analyze-button"
              type="submit"
            >
              <span
                id="analyze-spinner"
                class="button-spinner"
                aria-hidden="true"
                hidden
              ></span>
              <span>Analyze Highlights</span>
            </button>
          </div>
          <p
            id="transcript-message"
            class="transcript-message"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <pre
            id="submitted-transcript"
            class="submitted-transcript"
            aria-label="Submitted transcript"
            hidden
          ></pre>
        </form>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
